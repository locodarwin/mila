name: Desktop

# Builds the desktop app and has it try itself (docs/PLAN.md section 3). Windows can only
# be built here, so this is how a build for it is tried: run it by hand, or with a version
# tag, which also attaches the installers to that release.
# A tag, or a run by hand, also builds the server program for each system a release
# offers (make release-bins, docs/PLAN.md section 8), attached beside the installers.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      systems:
        description: Which systems to build on, as a JSON list
        type: string
        default: '["ubuntu-22.04", "windows-latest"]'
      programs:
        description: Also build the server program for each system
        type: boolean
        default: true

# Nothing unless a job says so; each asks for the least it needs.
permissions: {}

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.systems || '["ubuntu-22.04", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # The job's token stays out of .git/config, where npm ci's install
          # scripts could read it.
          persist-credentials: false
      # A release (a tag) restores no cache: any run on main could have written one, and
      # what a cache holds goes into the installers unchecked. Other runs keep the
      # download caches, never target/, the build itself.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'npm' || '' }}
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - run: rustup toolchain install stable --profile minimal && rustup default stable
        shell: bash
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: desktop-${{ matrix.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - name: What Linux needs to build it, and to try it with no screen
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev xdg-utils xvfb dbus-x11 file
      - name: The version, from the tag or the last one
        id: version
        shell: bash
        run: |
          described=$(git describe --tags --always)
          number=$(printf '%s' "$described" | sed -E 's/^v//; s/-.*//')
          [[ $number =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || number=0.0.0
          echo "number=$number" >>"$GITHUB_OUTPUT"
          echo "described=$described" >>"$GITHUB_OUTPUT"
      - name: The Mila it runs on this computer
        shell: bash
        env:
          MILA_VERSION: ${{ steps.version.outputs.described }}
          MILA_COMMIT: ${{ github.sha }}
        run: sh desktop/scripts/build-sidecar.sh
      - run: npm ci --no-audit --no-fund
        working-directory: desktop
      # On Linux only: they are the same rules on both, and a Windows test program of a
      # Tauri app can't start without the manifest only the app itself is built with.
      - run: cargo test
        if: runner.os != 'Windows'
        working-directory: desktop/src-tauri
      - name: Build it
        working-directory: desktop
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1"
          NUMBER: ${{ steps.version.outputs.number }}
        run: |
          # Only this build's installers, for the release to attach.
          rm -rf src-tauri/target/release/bundle
          bundles=nsis
          [ "$RUNNER_OS" = Linux ] && bundles=appimage
          npx tauri build --bundles "$bundles" --config "{\"version\":\"$NUMBER\"}"
      - name: It tries itself, on Linux
        if: runner.os == 'Linux'
        run: desktop/scripts/smoke.sh "$PWD/desktop/src-tauri/target/release/mila-desktop" "$RUNNER_TEMP/smoke"
      # The same two programs the installer puts on disk, for running without installing.
      - name: The portable zip, on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NUMBER: ${{ steps.version.outputs.number }}
        run: |
          $release = "desktop\src-tauri\target\release"
          New-Item -ItemType Directory -Force "$release\bundle\portable", "$env:RUNNER_TEMP\Mila" | Out-Null
          Copy-Item "$release\mila-desktop.exe", "$release\mila.exe" "$env:RUNNER_TEMP\Mila"
          Compress-Archive -Path "$env:RUNNER_TEMP\Mila" -DestinationPath "$release\bundle\portable\Mila_${env:NUMBER}_x64-portable.zip"
          Expand-Archive "$release\bundle\portable\*.zip" "$env:RUNNER_TEMP\unzipped"
      # From the unzipped copy, which shows that the zip holds all it needs.
      - name: It tries itself, on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MILA_DESKTOP_SMOKE = '1'
          $env:MILA_DESKTOP_HOME = "$env:RUNNER_TEMP\smoke"
          New-Item -ItemType Directory -Force $env:MILA_DESKTOP_HOME | Out-Null
          $app = Start-Process -FilePath "$env:RUNNER_TEMP\unzipped\Mila\mila-desktop.exe" -PassThru
          if (-not $app.WaitForExit(150000)) { $app.Kill(); throw 'it did not finish' }
          Get-Content "$env:MILA_DESKTOP_HOME\smoke.txt" -ErrorAction SilentlyContinue
          Get-Content "$env:MILA_DESKTOP_HOME\server.log" -Tail 20 -ErrorAction SilentlyContinue
          if (-not (Select-String -Quiet -Path "$env:MILA_DESKTOP_HOME\smoke.txt" -Pattern '^passed$')) { throw 'it did not pass' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mila-desktop-${{ runner.os }}
          if-no-files-found: error
          # A release keeps its own copies.
          retention-days: 7
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/portable/*.zip

  programs:
    if: github.event_name == 'push' || inputs.programs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # A release's tag is vX.Y.Z and nothing else: its name goes into the files'
      # names, which the install script holds to the tag it checks them against.
      - name: The tag is a version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ $TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] ||
            { echo "::error::A release's tag is vX.Y.Z, such as v3.0.0; this one is not."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # The job's token stays out of .git/config, where npm ci's install
          # scripts could read it.
          persist-credentials: false
      # make release-bins names the files from git describe, which could name
      # another tag on the same commit.
      - name: The files are named for this tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          described=$(git describe --tags --always)
          [ "$described" = "$TAG" ] ||
            { echo "::error::git describe names $described, not $TAG, so the files would not carry this tag's name."; exit 1; }
      # No caches on a tag, for the reason the build's steps give.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json
      - run: make release-bins
      # The .deb and .rpm: dpkg-deb comes with the runner, rpmbuild with Ubuntu's rpm.
      - run: sudo apt-get install -y --no-install-recommends rpm
      - run: make release-packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mila-programs
          if-no-files-found: error
          retention-days: 7
          path: |
            bin/release/*.tar.gz
            bin/release/*.zip
            bin/release/*.deb
            bin/release/*.rpm
            bin/release/install.sh

  release:
    if: github.event_name == 'push'
    needs: [build, programs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # GitHub's attestation of where the files were built, signed for this
      # workflow and tag (id-token), kept with the repository (attestations).
      id-token: write
      attestations: write
    steps:
      - name: The tag is a version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ $TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] ||
            { echo "::error::A release's tag is vX.Y.Z, such as v3.0.0; this one is not."; exit 1; }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: installers
          merge-multiple: true
      # From 3.0 the install script refuses a release without an attestation,
      # and GitHub makes them only for a public repository: a 3.0 or later tag
      # waits until the repository is public (docs/PLAN.md section 8).
      - name: Check that the release can be attested
        if: github.event.repository.private
        env:
          TAG: ${{ github.ref_name }}
        run: |
          major=${TAG#v}
          major=${major%%.*}
          case $major in '' | *[!0-9]*) major=0 ;; esac
          if [ "$major" -ge 3 ]; then
            echo "::error::$TAG needs an attestation, which GitHub makes only for a public repository. Make the repository public, then push the tag again."
            exit 1
          fi
          echo "::notice::The repository is private, so $TAG has checksums but no attestation."
      - name: Checksums
        run: |
          # The installers are not signed, so their checksums go beside them.
          find installers -type f \( -name '*.AppImage' -o -name '*.exe' -o -name '*.zip' -o -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' -o -name install.sh \) >files.txt
          # Each by its name alone, so sha256sum -c works beside the downloads.
          while read -r f; do (cd "$(dirname "$f")" && sha256sum "$(basename "$f")"); done <files.txt >SHA256SUMS
      - name: Attest where they were built
        id: attest
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: SHA256SUMS
      # Releases are immutable once published: nothing can be added to one
      # after. So the release is made with its files, which gh does as a draft
      # it uploads them to and then publishes.
      - name: Make the release, with its files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          # A release already there, published or a draft, is left as it is: one
          # replaced quietly is one nobody can tell from the first.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A release of $TAG is there already, so nothing is added to it. Delete it if it is a draft left by a run that failed, then run this again."
            exit 1
          fi
          # The attestation beside them too, so the install script checks it
          # with no GitHub sign-in (gh attestation verify --bundle).
          set -- SHA256SUMS
          if [ -n "$BUNDLE" ]; then
            cp "$BUNDLE" mila.intoto.jsonl
            set -- "$@" mila.intoto.jsonl
          fi
          xargs -a files.txt gh release create "$TAG" --verify-tag --title "Mila ${TAG#v}" --notes "" "$@"
