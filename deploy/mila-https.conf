# Mila's own HTTPS, for the systemd unit: a drop-in that gives Mila a
# Let's Encrypt certificate for its domain and lets it serve ports 443 and
# 80 itself, with no proxy in front. The domain must point at this machine,
# with both ports open to the internet.
#   sudo mkdir -p /etc/systemd/system/mila.service.d
#   sudo cp mila-https.conf /etc/systemd/system/mila.service.d/https.conf
#   (set the domain and email below)
#   sudo systemctl daemon-reload && sudo systemctl restart mila
[Service]
Environment=MILA_TLS_DOMAIN=mila.example.com
Environment=MILA_TLS_EMAIL=you@example.com
# The address people use becomes https:// and the domain.
Environment=MILA_BASE_URL=
# The one thing more Mila may do: bind ports below 1024. The unit's own
# user namespace has to go for that, since a capability inside one does not
# reach the computer's network.
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
PrivateUsers=false
