# Lets Mila serve HTTPS itself (tls_domain in /etc/mila/mila.toml): it may
# bind ports below 1024, and nothing more. The unit's own user namespace has
# to go for that, since a capability inside one does not reach the
# computer's network.
#   sudo install -D -m 644 /usr/share/mila/own-https.conf /etc/systemd/system/mila.service.d/own-https.conf
#   sudo systemctl daemon-reload && sudo systemctl restart mila
[Service]
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
PrivateUsers=false
